name: E2E Testing

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  path-collisions:
    name: Path case collisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CI runs on a case-sensitive filesystem, so two tracked paths like
      # CLAUDE.md and claude.md coexist happily here while silently clobbering
      # each other on a Windows or macOS checkout — the working tree ends up
      # with one file's content and git reports the other as modified.
      - name: Fail on tracked paths that differ only by case
        run: |
          git ls-files | awk '
            {
              key = tolower($0)
              group[key] = (key in group) ? group[key] "\n  " $0 : "  " $0
              count[key]++
            }
            END {
              found = 0
              for (key in count) {
                if (count[key] > 1) {
                  if (!found) print "Tracked paths that differ only by case:"
                  print group[key]
                  found = 1
                }
              }
              if (found) {
                print ""
                print "These overwrite each other on case-insensitive filesystems."
                print "Keep one path and remove the other with: git rm --cached <path>"
                exit 1
              }
              print "No case-colliding tracked paths."
            }
          '

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Flowie.sln
      - run: dotnet build Flowie.sln --configuration Release --no-restore
      - run: dotnet test Flowie.sln --configuration Release --no-build --verbosity normal

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'E2e_Str0ngPass!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'E2e_Str0ngPass!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/flowie-app/package-lock.json

      - name: Start backend
        working-directory: ./backend/Flowie.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5229
          ConnectionStrings__FlowieDb: 'Server=localhost,1433;Database=Flowie;User Id=sa;Password=E2e_Str0ngPass!;TrustServerCertificate=True'
          # The app logs through Serilog, which has no sinks configured in
          # Development — give it a console sink so backend.log shows requests
          # and exception stack traces.
          Serilog__WriteTo__0__Name: Console
          Serilog__MinimumLevel__Default: Information
          Serilog__MinimumLevel__Override__Microsoft: Warning
          Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore: Warning
        run: |
          nohup dotnet run --no-launch-profile > backend.log 2>&1 &
          timeout 120 bash -c 'until curl -fsS http://localhost:5229/health; do sleep 2; done'

      - name: Install frontend dependencies
        working-directory: ./frontend/flowie-app
        run: npm ci

      - name: Start frontend
        working-directory: ./frontend/flowie-app
        run: |
          nohup npx ng serve --configuration development --ssl false --host localhost --port 4200 > frontend.log 2>&1 &
          timeout 180 bash -c 'until curl -fsS http://localhost:4200 > /dev/null; do sleep 3; done'

      - name: Install Playwright browsers
        working-directory: ./frontend/flowie-app
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: ./frontend/flowie-app
        env:
          E2E_BASE_URL: http://localhost:4200
          E2E_API_URL: http://localhost:5229
          E2E_REGISTRATION_CODE: '1311'
        run: npx playwright test

      - name: Print failure diagnostics
        if: failure()
        working-directory: ./frontend/flowie-app
        run: |
          echo "===== error-context snapshots ====="
          find test-results -name 'error-context.md' | sort | head -30 | while read f; do
            echo "----- $f -----"
            head -c 3000 "$f"
            echo
          done
          echo "===== backend runtime log (errors/warnings + slow or failed requests) ====="
          grep -aE '\[ERR\]|\[WRN\]|\[FTL\]|Exception|responded 5[0-9][0-9]|responded 4[0-9][0-9]' ../../backend/Flowie.Api/backend.log | tail -n 120 || true
          echo "===== backend.log tail ====="
          tail -n 60 ../../backend/Flowie.Api/backend.log || true
          echo "===== frontend.log tail ====="
          tail -n 30 frontend.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/flowie-app/playwright-report/
            frontend/flowie-app/test-results/
            backend/Flowie.Api/backend.log
            frontend/flowie-app/frontend.log
          retention-days: 7
