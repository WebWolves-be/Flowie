<div class="flex flex-col w-screen max-w-full h-dvh md:h-auto md:w-[32rem] md:max-w-[calc(100vw-2rem)] md:max-h-[90dvh] min-w-0 bg-white rounded-none md:rounded-xl shadow-xl" role="dialog" aria-modal="true">
  <div class="flex items-center justify-between gap-2 flex-shrink-0 px-4 py-4 pt-4-safe-t md:pt-6 md:px-6 md:pb-0 border-b border-gray-200 md:border-b-0 min-w-0">
    <h2 class="text-lg font-semibold text-gray-900 min-w-0 break-words">Agenda feed URL vernieuwen</h2>
    <button type="button" (click)="onCancel()" class="md:hidden flex items-center justify-center flex-shrink-0 min-w-touch min-h-touch -mr-2 p-1 rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-100">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div class="flex-1 min-w-0 scroll-pane px-4 py-4 md:px-6 md:py-4 space-y-4">
    @if (errorMessage()) {
      <div class="p-3 bg-red-50 border border-red-200 rounded-lg">
        <div class="flex items-start">
          <i class="fas fa-circle-exclamation text-red-600 mr-2 flex-shrink-0 mt-0.5"></i>
          <p class="text-sm text-red-800">{{ errorMessage() }}</p>
        </div>
      </div>
    }

    <p class="text-sm text-gray-600">
      Weet je zeker dat je de agenda feed URL wilt vernieuwen? De oude URL werkt
      daarna niet meer en je moet de nieuwe URL opnieuw toevoegen aan je
      agenda-app.
    </p>
  </div>

  <div class="flex-shrink-0 flex flex-col-reverse md:flex-row md:justify-end gap-3 px-4 py-6 md:px-6 md:pb-8 md:pt-4 border-t border-gray-200 md:border-t-0 safe-area-bottom">
    <button
      type="button"
      (click)="onCancel()"
      class="w-full md:w-auto inline-flex items-center justify-center px-4 py-2 min-h-touch text-sm rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50">
      Annuleren
    </button>
    <button
      type="button"
      (click)="onConfirm()"
      [disabled]="isRegenerating()"
      class="w-full md:w-auto inline-flex items-center justify-center px-4 py-2 min-h-touch text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-500 disabled:opacity-50 disabled:cursor-not-allowed">
      @if (isRegenerating()) {
        <span>Vernieuwen...</span>
      } @else {
        <span>Vernieuwen</span>
      }
    </button>
  </div>
</div>
