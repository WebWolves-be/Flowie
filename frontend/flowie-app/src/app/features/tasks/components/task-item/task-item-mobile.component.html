<div class="flex items-stretch gap-2 min-w-0 bg-white">
  <!-- The status control is the primary action: one tap moves the task forward
       instead of expand -> find button -> tap. Tasks with subtasks derive their
       status from those, so the control is inert and reads as a progress badge. -->
  <button
    type="button"
    class="flex-shrink-0 flex items-center justify-center min-w-touch min-h-touch -ml-1 rounded-full"
    [class.cursor-default]="hasSubtasks()"
    [attr.aria-label]="hasSubtasks() ? statusLabel() : 'Status wijzigen: ' + statusLabel()"
    [attr.aria-disabled]="hasSubtasks()"
    [title]="statusLabel()"
    (click)="onStatusTap($event)">
    <span
      class="progress-circle flex items-center justify-center w-9 h-9 rounded-lg text-xs font-bold"
      [ngClass]="progressClass()">
      @if (hasSubtasks()) {
        {{ taskProgress() }}%
      } @else {
        <i class="fas" [ngClass]="{
          'fa-check': statusIcon() === 'check',
          'fa-question': statusIcon() === 'ongoing',
          'fa-clock': statusIcon() === 'waiting',
          'fa-times': statusIcon() === 'pending'
        }"></i>
      }
    </span>
  </button>

  <!-- Tapping anywhere else opens the detail. -->
  <button
    type="button"
    class="flex-1 min-w-0 flex items-center gap-2 py-2 text-left min-h-touch"
    (click)="detailRequested.emit(task().taskId)">
    <span class="flex-1 min-w-0">
      <span
        class="block text-sm font-medium break-words line-clamp-2"
        [class.text-gray-500]="isDone()"
        [class.line-through]="isDone()"
        [class.text-gray-900]="!isDone()">
        {{ task().title }}
      </span>

      <!-- Triage data at rest: without this a list of ten tasks is ten names. -->
      <span class="flex flex-wrap items-center gap-x-3 gap-y-0.5 mt-0.5 text-xs text-gray-500 min-w-0">
        @if (task().dueDate) {
          <span
            class="inline-flex items-center gap-1 whitespace-nowrap"
            [class.text-red-600]="isTaskOverdue()"
            [class.font-medium]="isTaskOverdue()">
            <i class="fas fa-calendar-day"></i>
            {{ task().dueDate | date: 'd MMM' : '' : 'nl-NL' }}
          </span>
        }
        @if (task().employeeName) {
          <span class="inline-flex items-center gap-1 min-w-0">
            <i class="fas fa-user flex-shrink-0"></i>
            <span class="truncate">{{ task().employeeName }}</span>
          </span>
        }
        @if (isWaitingOn() && waitingDays() !== null) {
          <span class="inline-flex items-center gap-1 whitespace-nowrap text-amber-600">
            <i class="fas fa-hourglass-half"></i>
            {{ waitingDays() === 0 ? 'vandaag' : waitingDays() + 'd' }}
          </span>
        }
        @if (hasSubtasks()) {
          <span class="inline-flex items-center gap-1 whitespace-nowrap">
            <i class="fas fa-list-check"></i>
            {{ completedSubtasks() }}/{{ task().subtasks!.length }}
          </span>
        }
      </span>
    </span>

    <i class="fas fa-chevron-right text-gray-300 flex-shrink-0"></i>
  </button>
</div>
