<header
  class="fixed top-0 left-0 right-0 z-40 lg:hidden bg-teal-800 text-white border-b border-teal-900/40 pt-safe-t">
  <div class="flex h-14 items-center gap-2 px-4">
    <div class="w-8 h-8 bg-teal-500 rounded flex items-center justify-center flex-shrink-0">
      <span class="text-white font-extrabold text-sm">F</span>
    </div>
    <span class="text-white font-semibold text-base">Flowie</span>

    <div class="relative ml-auto flex-shrink-0">
      <button
        type="button"
        (click)="toggleMenu($event)"
        class="flex items-center justify-center min-w-touch min-h-touch rounded-full text-white/90 hover:text-white hover:bg-white/10 transition-colors"
        title="Account"
        [attr.aria-expanded]="showMenu()"
        aria-haspopup="menu">
        <span class="flex items-center justify-center w-8 h-8 rounded-full bg-teal-600 text-xs font-semibold">
          {{ userInitials() || '?' }}
        </span>
      </button>
      @if (showMenu()) {
        <div
          role="menu"
          class="absolute right-0 mt-2 w-56 max-w-[calc(100vw-2rem)] bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden">
          <p class="px-4 py-3 text-sm text-gray-500 border-b border-gray-100 truncate">
            {{ currentUser()?.name }}
          </p>
          <button
            type="button"
            (click)="onLogout()"
            class="w-full text-left px-4 py-3 min-h-touch text-sm text-gray-700 hover:bg-gray-100 flex items-center gap-3"
            title="Uitloggen">
            <i class="fas fa-right-from-bracket w-4"></i>
            Uitloggen
          </button>
        </div>
      }
    </div>
  </div>
</header>
